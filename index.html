<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Board</title>
<style>
  :root{
    --ink:#0d1b3e;
    --ink-deep:#071026;
    --gold:#f5c518;
    --cadet:#5f9ea0;
    --paper:#f7f4ec;
    --line:rgba(13,27,62,.14);
    --text:#23262e;
    --muted:#6b7280;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink-deep);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .shell{max-width:660px;margin:0 auto;padding:0 16px 64px}

  header.masthead{
    background:var(--ink);
    color:#fff;
    padding:28px 20px 22px;
    border-bottom:3px solid var(--gold);
    border-radius:0 0 14px 14px;
    margin:0 -16px 20px;
  }
  .masthead h1{
    font-family:var(--serif);
    font-size:30px;
    line-height:1.15;
    margin:0;
    letter-spacing:.3px;
  }
  .masthead p{margin:6px 0 0;color:rgba(255,255,255,.72);font-size:14px}

  nav.tabs{display:flex;gap:8px;margin-bottom:20px}
  nav.tabs button{
    flex:1;
    font:inherit;
    font-size:15px;
    padding:11px 8px;
    background:rgba(255,255,255,.06);
    color:rgba(255,255,255,.7);
    border:1px solid rgba(255,255,255,.12);
    border-radius:9px;
    cursor:pointer;
  }
  nav.tabs button[aria-selected="true"]{
    background:var(--gold);
    color:var(--ink);
    border-color:var(--gold);
    font-weight:600;
  }
  nav.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .panel{display:none}
  .panel.on{display:block}

  .card{
    background:var(--paper);
    border-radius:12px;
    padding:16px 16px 14px;
    margin-bottom:12px;
    border:1px solid rgba(0,0,0,.06);
  }

  .trip-head{
    display:flex;
    width:100%;
    text-align:left;
    background:none;
    border:0;
    font:inherit;
    color:inherit;
    padding:0;
    cursor:pointer;
    gap:12px;
    align-items:flex-start;
  }
  .trip-head:focus-visible{outline:2px solid var(--cadet);outline-offset:4px}
  .trip-title{
    font-family:var(--serif);
    font-size:20px;
    line-height:1.25;
    margin:0 0 2px;
  }
  .trip-when{font-size:14px;color:var(--muted);margin:0}
  .chev{margin-left:auto;color:var(--cadet);font-size:20px;line-height:1;padding-top:4px;transition:transform .18s ease}
  .trip-head[aria-expanded="true"] .chev{transform:rotate(90deg)}

  .chip{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.4px;
    padding:3px 9px;
    border-radius:999px;
    margin:8px 6px 0 0;
  }
  .chip.planning{background:rgba(95,158,160,.18);color:#33686a}
  .chip.watching{background:rgba(13,27,62,.1);color:var(--ink)}
  .chip.booked{background:rgba(46,125,50,.15);color:#2e7d32}
  .chip.dead{background:rgba(0,0,0,.08);color:var(--muted)}
  .chip.review{background:var(--gold);color:var(--ink)}

  .detail{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .detail h3{
    font-family:var(--serif);
    font-size:15px;
    color:var(--ink);
    margin:18px 0 6px;
    padding-bottom:4px;
    border-bottom:2px solid var(--gold);
  }
  .detail h3:first-child{margin-top:0}
  .rows{margin:0;font-size:14.5px}
  .rows div{display:flex;gap:12px;padding:3px 0}
  .rows dt{flex:0 0 42%;color:var(--muted);margin:0}
  .rows dd{margin:0;flex:1}
  .num{font-variant-numeric:tabular-nums;font-weight:600}
  .good{color:#2e7d32}

  table.log{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
  table.log th{
    text-align:left;
    font-weight:600;
    color:var(--muted);
    font-size:12.5px;
    padding:4px 6px 4px 0;
    border-bottom:1px solid var(--line);
  }
  table.log td{padding:6px 6px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
  table.log td.v{font-variant-numeric:tabular-nums;white-space:nowrap}

  .spark{display:block;width:100%;height:56px;margin:8px 0 2px}

  .alert{
    background:var(--paper);
    border-radius:12px;
    padding:0;
    margin-bottom:12px;
    overflow:hidden;
    border:1px solid rgba(0,0,0,.06);
  }
  .alert .bar{padding:9px 16px;font-family:var(--serif);font-size:15px;color:#fff}
  .alert.S .bar{background:var(--ink);color:var(--gold)}
  .alert.A .bar{background:var(--cadet)}
  .alert .body{padding:13px 16px 15px}
  .alert h2{font-family:var(--serif);font-size:19px;margin:0 0 4px;line-height:1.25}
  .alert .meta{font-size:13px;color:var(--muted);margin:0 0 8px}
  .alert p.sum{margin:0;font-size:15px}
  .alert a{color:var(--ink);font-weight:600}

  .empty{
    background:rgba(255,255,255,.05);
    border:1px dashed rgba(255,255,255,.22);
    color:rgba(255,255,255,.8);
    border-radius:12px;
    padding:22px 18px;
    font-size:15px;
  }
  .empty strong{display:block;font-family:var(--serif);font-size:17px;color:#fff;margin-bottom:4px}

  .flagline{text-align:center;margin:8px 0 0}
  .flagline button{background:none;border:0;color:rgba(255,255,255,.45);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
  footer.stamp{
    color:rgba(255,255,255,.45);
    font-size:12.5px;
    text-align:center;
    margin-top:26px;
  }
</style>
</head>
<body>
<div class="shell">

  <header class="masthead">
    <h1>Trip Board</h1>
    <p>What we're watching, what it costs, and what's worth booking.</p>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-alerts" aria-controls="panel-alerts" aria-selected="true">Alerts</button>
    <button role="tab" id="tab-trips" aria-controls="panel-trips" aria-selected="false">Trips</button>
  </nav>

  <section class="panel on" id="panel-alerts" role="tabpanel" aria-labelledby="tab-alerts"></section>
  <section class="panel" id="panel-trips" role="tabpanel" aria-labelledby="tab-trips"></section>

  <footer class="stamp" id="stamp"></footer>
  <p class="flagline"><button type="button" onclick="window.Kit && Kit.flag.menu()">Raise a flag</button></p>
</div>

<script>
const $ = s => document.querySelector(s);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function parseDate(d){
  if(!d) return null;
  const p = String(d).split("-").map(Number);
  if(p.length !== 3 || p.some(isNaN)) return null;
  return new Date(p[0], p[1]-1, p[2]);
}
function shortDate(d){
  const t = parseDate(d);
  return t ? MONTHS[t.getMonth()] + " " + t.getDate() : esc(d);
}
function longDate(d){
  const t = parseDate(d);
  return t ? MONTHS[t.getMonth()] + " " + t.getDate() + ", " + t.getFullYear() : esc(d);
}
function addDays(d, n){
  const t = parseDate(d);
  if(!t) return null;
  t.setDate(t.getDate() + n);
  return t;
}
function money(n){
  return n == null ? null : "$" + Number(n).toLocaleString("en-US");
}
function pts(n){
  return n == null ? null : Number(n).toLocaleString("en-US") + " pts";
}

// ---- tabs ----
function selectTab(which){
  const map = {alerts:["#tab-alerts","#panel-alerts"], trips:["#tab-trips","#panel-trips"]};
  Object.keys(map).forEach(k => {
    const on = k === which;
    $(map[k][0]).setAttribute("aria-selected", on ? "true" : "false");
    $(map[k][1]).classList.toggle("on", on);
  });
}
$("#tab-alerts").addEventListener("click", () => selectTab("alerts"));
$("#tab-trips").addEventListener("click", () => selectTab("trips"));

// ---- sparkline ----
function sparkline(entries){
  const vals = entries.filter(e => typeof e.value === "number").map(e => e.value);
  if(vals.length < 2) return "";
  const w = 320, h = 56, pad = 6;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const step = (w - pad*2) / (vals.length - 1);
  const pt = i => [pad + i*step, pad + (h - pad*2) * (1 - (vals[i]-min)/span)];
  const line = vals.map((_,i) => pt(i).join(",")).join(" ");
  const lowIdx = vals.indexOf(min);
  const [lx, ly] = pt(lowIdx);
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Price history, low of '+money(min)+'">'
    + '<polyline points="'+line+'" fill="none" stroke="#5f9ea0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<circle cx="'+lx+'" cy="'+ly+'" r="4" fill="#2e7d32"/>'
    + '</svg>';
}

// ---- trips ----
function targetLine(t){
  const g = t.targets || {};
  const bits = [];
  if(g.allInTwo != null) bits.push("All in for two under " + money(g.allInTwo));
  if(g.flightCashTwo != null) bits.push("Flights for two under " + money(g.flightCashTwo));
  if(g.flightPointsEach != null) bits.push("Flights under " + pts(g.flightPointsEach) + " each");
  if(g.lodgingPerNight != null) bits.push("Lodging under " + money(g.lodgingPerNight) + " a night");
  return bits;
}

function bestSeen(t){
  const log = (t.priceLog || []).filter(e => typeof e.value === "number");
  if(!log.length) return null;
  return log.reduce((a,b) => b.value < a.value ? b : a);
}

function reviewDue(t){
  if(!t.targetSetOn || !t.reviewAfterDays) return null;
  const due = addDays(t.targetSetOn, t.reviewAfterDays);
  if(!due) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return { due, overdue: today >= due };
}

function tripCard(t, i){
  const status = (t.status || "planning").toLowerCase();
  const rev = reviewDue(t);
  const best = bestSeen(t);
  const log = (t.priceLog || []).slice().sort((a,b) => (a.date < b.date ? -1 : 1));

  let chips = '<span class="chip '+esc(status)+'">'+esc(status)+'</span>';
  if(rev && rev.overdue) chips += '<span class="chip review">Target review due</span>';

  const targets = targetLine(t);
  const targetsHtml = targets.length
    ? targets.map(b => '<div><dt>Target</dt><dd class="num">'+esc(b)+'</dd></div>').join("")
    : '<div><dt>Target</dt><dd>Not set yet</dd></div>';

  const logHtml = log.length
    ? sparkline(log) + '<table class="log"><thead><tr><th>Date</th><th>Route</th><th>Price</th><th>Source</th></tr></thead><tbody>'
      + log.slice().reverse().map(e =>
          '<tr><td class="v">'+shortDate(e.date)+'</td><td>'+esc(e.route || "\u2014")+'</td>'
          + '<td class="v'+(best && e.date===best.date && e.value===best.value ? ' good' : '')+'">'
          + esc(e.unit === "points" ? pts(e.value) : money(e.value))+'</td>'
          + '<td>'+esc(e.source || "")+'</td></tr>').join("")
      + '</tbody></table>'
    : '<p style="font-size:14.5px;color:var(--muted);margin:2px 0 0">No prices logged yet. Entries land here once the tracked routes start reporting.</p>';

  const routes = (t.trackedRoutes && t.trackedRoutes.length)
    ? t.trackedRoutes.map(r => esc(r)).join(", ")
    : "None set up yet";

  return ''
  + '<article class="card">'
  + '<button class="trip-head" aria-expanded="false" aria-controls="d'+i+'">'
  +   '<span>'
  +     '<h2 class="trip-title">'+esc(t.destination || t.name || "Destination undecided")+'</h2>'
  +     '<p class="trip-when">'+esc(t.window || "")+'</p>'
  +     chips
  +   '</span>'
  +   '<span class="chev" aria-hidden="true">\u203a</span>'
  + '</button>'
  + '<div class="detail" id="d'+i+'" hidden>'
  +   '<h3>Targets</h3><dl class="rows">'+targetsHtml
  +     (best ? '<div><dt>Best seen</dt><dd class="num good">'+esc(best.unit==="points"?pts(best.value):money(best.value))+' on '+shortDate(best.date)+'</dd></div>' : '')
  +     (t.targetSetOn ? '<div><dt>Target set</dt><dd>'+longDate(t.targetSetOn)+(rev ? ', review '+MONTHS[rev.due.getMonth()]+' '+rev.due.getDate() : '')+'</dd></div>' : '')
  +     (t.floorAllInTwo != null ? '<div><dt>Walk-away ceiling</dt><dd class="num">'+esc(money(t.floorAllInTwo))+'</dd></div>' : '')
  +   '</dl>'
  +   '<h3>Plan</h3><dl class="rows">'
  +     '<div><dt>Flights</dt><dd>'+esc(t.flightPlan || "Undecided")+'</dd></div>'
  +     '<div><dt>Lodging</dt><dd>'+esc(t.lodgingPlan || "Undecided")+'</dd></div>'
  +     '<div><dt>From</dt><dd>'+esc((t.airports||[]).join(" or ") || "\u2014")+'</dd></div>'
  +     '<div><dt>Flexibility</dt><dd>'+esc(t.flexibility || "\u2014")+'</dd></div>'
  +     '<div><dt>Tracked routes</dt><dd>'+routes+'</dd></div>'
  +   '</dl>'
  +   (t.notes ? '<h3>Notes</h3><p style="margin:0;font-size:15px">'+esc(t.notes)+'</p>' : '')
  +   '<h3>Price log</h3>'+logHtml
  + '</div>'
  + '</article>';
}

function renderTrips(data){
  const trips = (data && data.trips) || [];
  const live = trips.filter(t => (t.status||"").toLowerCase() !== "dead");
  if(!live.length){
    $("#panel-trips").innerHTML = '<div class="empty"><strong>No trips on the board</strong>Tell Claude a window you might travel and it will add the trip, set the targets, and start logging prices here.</div>';
    return;
  }
  $("#panel-trips").innerHTML = live.map(tripCard).join("");
  document.querySelectorAll(".trip-head").forEach(btn => {
    btn.addEventListener("click", () => {
      const open = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", open ? "false" : "true");
      document.getElementById(btn.getAttribute("aria-controls")).hidden = open;
    });
  });
}

// ---- alerts ----
function renderAlerts(data, trips){
  const alerts = ((data && data.alerts) || []).slice()
    .sort((a,b) => (a.date < b.date ? 1 : -1));
  if(!alerts.length){
    $("#panel-alerts").innerHTML = '<div class="empty"><strong>Nothing has cleared the bar yet</strong>Deals good enough to email land here, newest first, with the deadline and what made them worth it.</div>';
    return;
  }
  const names = {};
  ((trips && trips.trips) || []).forEach(t => names[t.id] = t.destination || t.name);
  $("#panel-alerts").innerHTML = alerts.map(a => {
    const g = (a.grade || "A").toUpperCase();
    const meta = [shortDate(a.date), names[a.tripId], a.deadline ? "Book by " + shortDate(a.deadline) : null]
      .filter(Boolean).map(esc).join(" \u00b7 ");
    return '<article class="alert '+esc(g)+'">'
      + '<div class="bar">'+esc(g)+' tier</div>'
      + '<div class="body"><h2>'+esc(a.title||"Untitled deal")+'</h2>'
      + '<p class="meta">'+meta+'</p>'
      + '<p class="sum">'+esc(a.summary||"")+'</p>'
      + (a.link ? '<p style="margin:10px 0 0"><a href="'+esc(a.link)+'">Open the deal</a></p>' : '')
      + '</div></article>';
  }).join("");
}

// ---- load ----
Promise.all([
  fetch("data/alerts.json?v=" + Date.now()).then(r => r.json()),
  fetch("data/trips.json?v=" + Date.now()).then(r => r.json())
]).then(([alerts, trips]) => {
  renderAlerts(alerts, trips);
  renderTrips(trips);
  const when = trips && trips.updated;
  $("#stamp").textContent = when ? "Board last updated " + longDate(when) : "";
}).catch(() => {
  $("#panel-alerts").innerHTML = '<div class="empty"><strong>The board data did not load</strong>Check that data/alerts.json and data/trips.json exist and are valid JSON.</div>';
  $("#panel-trips").innerHTML = $("#panel-alerts").innerHTML;
});
</script>
<script src="https://feirzen.github.io/flag-hub/kit/kit.js" data-app="trip-board" data-name="Trip Board" data-look="off" data-gear="off" data-button="off" defer></script>
</body>
</html>
